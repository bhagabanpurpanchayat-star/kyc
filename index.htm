<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>KYC Portal - Dual KYC Counters | Mandatory Remark & Confirmation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 16px; }
        .app { max-width: 500px; margin: 0 auto; }
        
        .toast-notification { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 50px; z-index: 2000; font-size: 0.85rem; white-space: nowrap; }
        .waiting-card { text-align: center; padding: 40px 20px; background: white; border-radius: 24px; }
        .loading-spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #ec4899; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .prominent-sync-btn { background: linear-gradient(135deg, #ec4899, #db2777); border: none; padding: 10px 20px; border-radius: 50px; color: white; cursor: pointer; font-weight: 700; }
        .sync-progress-container { margin-top: 8px; display: none; }
        .sync-progress-bar-bg { background: #e2e8f0; border-radius: 20px; height: 6px; }
        .sync-progress-fill { background: linear-gradient(90deg, #10b981, #059669); width: 0%; height: 100%; border-radius: 20px; transition: width 0.3s; }
        .sync-progress-text { font-size: 0.65rem; text-align: center; margin-top: 4px; color: #475569; }
        .auth-card { background: white; border-radius: 32px; padding: 32px; margin-top: 20px; }
        .stat-value.today-kyc { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .stat-value.my-today-kyc { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
        .user-header { background: white; border-radius: 28px; padding: 14px 18px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .user-stats { display: flex; align-items: center; gap: 12px; background: #f1f5f9; padding: 6px 14px; border-radius: 40px; flex-wrap: wrap; }
        .stat-item { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; }
        .stat-label { color: #64748b; }
        .stat-value { font-weight: 800; color: #ec4899; background: white; padding: 2px 8px; border-radius: 20px; min-width: 35px; text-align: center; }
        .divider { width: 1px; height: 20px; background: #cbd5e1; }
        .logout-btn { background: #ef4444; border: none; padding: 8px 20px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; }
        .sync-container { background: white; border-radius: 60px; padding: 12px 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .record-count { font-size: 0.7rem; color: #475569; }
        .last-sync { font-size: 0.6rem; color: #6b7280; }
        .filter-section { background: white; border-radius: 24px; padding: 16px; margin-bottom: 16px; }
        .filter-title { font-size: 0.75rem; font-weight: 700; color: #4c1d95; margin-bottom: 12px; }
        .filter-row { margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
        .filter-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.7rem; font-weight: 700; color: #475569; }
        .filter-count { background: #8b5cf6; color: white; padding: 2px 10px; border-radius: 30px; font-size: 0.65rem; }
        .filter-count.zero { background: #ef4444; }
        .filter-select { width: 100%; padding: 12px 14px; font-size: 0.85rem; border: 1px solid #e2e8f0; border-radius: 16px; background: white; }
        .reset-filter-btn { background: #f1f5f9; border: none; padding: 8px; border-radius: 40px; width: 100%; cursor: pointer; font-size: 0.7rem; margin-top: 8px; }
        .data-card { background: white; border-radius: 24px; padding: 16px; margin-bottom: 16px; }
        .two-column-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .field-item { background: #f8fafc; border-radius: 16px; padding: 10px 12px; border: 1px solid #e2e8f0; }
        .field-item-full { grid-column: span 2; }
        .field-label-small { font-size: 0.6rem; text-transform: uppercase; font-weight: 700; color: #8b5cf6; margin-bottom: 4px; }
        .field-value-small { font-size: 0.85rem; font-weight: 600; color: #0f172a; }
        .reason-value { background: #fef3c7; display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; }
        .guardian-info { background: #f0fdf4; padding: 8px 12px; border-radius: 12px; border-left: 3px solid #22c55e; }
        .remark-select { width: 100%; padding: 12px 14px; font-size: 0.85rem; border: 1.5px solid #e2e8f0; border-radius: 16px; margin: 12px 0; cursor: pointer; }
        .action-buttons { display: flex; gap: 12px; margin-top: 12px; }
        .update-now-btn { flex: 1; padding: 12px; border-radius: 40px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; cursor: pointer; transition: transform 0.1s; }
        .update-now-btn:active { transform: scale(0.97); }
        .save-queue-btn { flex: 1; padding: 12px; border-radius: 40px; font-weight: 700; background: #f59e0b; color: white; border: none; cursor: pointer; }
        .completed-hint { background: #e2e8f0; padding: 10px; border-radius: 16px; font-size: 0.7rem; text-align: center; margin-top: 12px; }
        .queue-bar { background: white; border-radius: 24px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .queue-badge { padding: 6px 14px; border-radius: 40px; font-size: 0.75rem; font-weight: 700; background: #ef4444; color: white; }
        .upload-btn { background: linear-gradient(135deg, #10b981, #059669); border: none; padding: 8px 18px; border-radius: 40px; color: white; cursor: pointer; margin-left: 8px; }
        .result-item { background: white; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; border: 1px solid #e2e8f0; transition: background 0.1s; }
        .result-item:active { background: #f1f5f9; }
        .result-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .result-name { font-weight: 700; font-size: 0.8rem; }
        .refresh-icon { background: none; border: none; font-size: 0.7rem; cursor: pointer; padding: 2px 6px; border-radius: 20px; }
        .search-filter-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .mode-toggle { background: #f1f5f9; border: none; padding: 8px 18px; border-radius: 40px; font-weight: 600; font-size: 0.7rem; cursor: pointer; }
        .mode-toggle.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .progress-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .progress-card { background: white; border-radius: 32px; padding: 32px 24px; text-align: center; }
        .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ec4899, #db2777); width: 0%; transition: width 0.3s; }
        .footer-note { text-align: center; font-size: 0.6rem; color: rgba(255,255,255,0.9); margin-top: 20px; }
        .chart-container { background: #f8fafc; border-radius: 20px; padding: 8px; min-width: 160px; }
        .chart-title { font-size: 0.55rem; font-weight: 700; color: #64748b; text-align: center; margin-bottom: 6px; }
        .chart-bars { display: flex; gap: 6px; justify-content: center; align-items: flex-end; height: 70px; }
        .chart-bar-item { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; }
        .bar-value-top { font-size: 0.55rem; font-weight: 800; color: #4f46e5; margin-bottom: 3px; text-align: center; white-space: nowrap; }
        .bar { width: 100%; max-width: 24px; border-radius: 4px 4px 3px 3px; min-height: 3px; transition: height 0.3s ease; margin: 0 auto; }
        .bar-label { font-size: 0.55rem; font-weight: 800; color: #475569; margin-top: 5px; text-align: center; }
        .chart-legend { font-size: 0.5rem; color: #94a3b8; text-align: center; margin-top: 5px; }
        .online-dot-small { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 1; } }
        /* Custom Confirmation Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(4px); }
        .confirmation-modal { background: white; border-radius: 32px; max-width: 340px; width: 85%; padding: 24px 20px; text-align: center; animation: fadeInUp 0.2s ease; box-shadow: 0 25px 40px rgba(0,0,0,0.3); }
        .confirmation-modal h3 { font-size: 1.3rem; margin-bottom: 12px; color: #1e293b; }
        .confirmation-modal p { font-size: 0.85rem; color: #475569; margin-bottom: 16px; line-height: 1.4; }
        .confirmation-modal .remark-preview { background: #fef3c7; padding: 10px 14px; border-radius: 28px; font-weight: 700; margin: 12px 0; font-size: 0.85rem; color: #92400e; word-break: break-word; border-left: 3px solid #f59e0b; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 40px; font-weight: 700; border: none; cursor: pointer; font-size: 0.85rem; transition: opacity 0.1s; }
        .confirm-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .cancel-btn { background: #e2e8f0; color: #475569; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .remark-select.error-border { border-color: #ef4444; background-color: #fef2f2; }
    </style>
</head>
<body>
<div class="app" id="app">Loading...</div>

<script>
    // ==================== CONFIGURATION ====================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw_rDeNCe_h2tBhcrEX3WYXnMXy9KsUBJsTAOGBMi-fXCE7rr1Iv5chKcnpLw0-j0K0Ew/exec";
    
    const COL_SANSAD = 3;
    const COL_JOB_CARD = 4;
    const COL_APPLICANT_NAME = 6;
    const COL_GUARDIAN = 7;
    const COL_REASON = 14;
    const COL_NEW_REMARKS = 15;
    
    const DROPDOWN_OPTIONS = ["KYC DONE", "Biometric update required", "Migrant worker", "Aadhar name mismatch with Job Card", "Gender mismatch", "Death of worker", "Not included in SIR", "Unwilling to work (Consent required)", "Face Authentication : Failed (Error Code - K-100)", "Shifted worker", "Aadhar Authentication Failed"];
    
    const BAR_GRADIENTS = [
        { top: "#f59e0b", bottom: "#d97706" }, { top: "#10b981", bottom: "#059669" }, { top: "#3b82f6", bottom: "#1d4ed8" }, { top: "#ef4444", bottom: "#dc2626" }, { top: "#8b5cf6", bottom: "#7c3aed" }, { top: "#ec4899", bottom: "#db2777" }, { top: "#06b6d4", bottom: "#0891b2" }, { top: "#84cc16", bottom: "#65a30f" }, { top: "#f97316", bottom: "#ea580c" }, { top: "#14b8a6", bottom: "#0f766e" }, { top: "#a855f7", bottom: "#9333ea" }, { top: "#f43f5e", bottom: "#e11d48" }
    ];
    
    let sessionId = null;
    let currentUser = null;
    let allRecords = [];
    let filteredRecord = null;
    let selectedSansad = "";
    let selectedJobCard = "";
    let selectedApplicant = "";
    let pendingQueue = [];
    let isAutoSyncing = false;
    let currentMode = "filter";
    let searchQuery = "";
    
    const QUEUE_KEY = "kyc_queue_v7";
    const SESSION_KEY = "kyc_session";
    
    function generateSessionId() { return `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`; }
    function escapeHtml(s) { if(!s) return ""; return String(s).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    function showToast(msg, type = "success") { 
        let t = document.querySelector(".toast-notification"); 
        if(t) t.remove(); 
        t = document.createElement("div"); 
        t.className = "toast-notification"; 
        t.style.background = type === 'error' ? '#ef4444' : (type === 'warning' ? '#f59e0b' : '#10b981');
        t.innerHTML = `<span>${type === 'success' ? '✓' : (type === 'error' ? '✗' : '⚠')}</span> ${msg}`; 
        document.body.appendChild(t); 
        setTimeout(() => t.remove(), 2600); 
    }
    
    // ========== CONFIRMATION MODAL (Mandatory before update) ==========
    function showConfirmationModal(remark, applicantName, onConfirm, onCancel) {
        const existingModal = document.querySelector(".modal-overlay");
        if (existingModal) existingModal.remove();
        
        const modalDiv = document.createElement("div");
        modalDiv.className = "modal-overlay";
        modalDiv.innerHTML = `
            <div class="confirmation-modal">
                <h3>⚠️ Confirm KYC Update</h3>
                <p>You are about to update record for <strong>${escapeHtml(applicantName)}</strong></p>
                <div class="remark-preview">📌 ${escapeHtml(remark)}</div>
                <p style="font-size:0.75rem;">This action cannot be undone. The record will be marked as completed.</p>
                <div class="modal-buttons">
                    <button class="confirm-btn" id="confirmUpdateBtn">✅ Yes, Update</button>
                    <button class="cancel-btn" id="cancelUpdateBtn">❌ Cancel</button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        
        const confirmBtn = modalDiv.querySelector("#confirmUpdateBtn");
        const cancelBtn = modalDiv.querySelector("#cancelUpdateBtn");
        
        const cleanup = () => { if (modalDiv && modalDiv.remove) modalDiv.remove(); };
        confirmBtn.onclick = () => { cleanup(); if (onConfirm) onConfirm(); };
        cancelBtn.onclick = () => { cleanup(); if (onCancel) onCancel(); };
    }
    
    function showProgress(c, t, m) { 
        let o = document.querySelector(".progress-overlay"); 
        if(o) o.remove(); 
        o = document.createElement("div"); 
        o.className = "progress-overlay"; 
        o.innerHTML = `<div class="progress-card"><div>${m}</div><div style="font-size:1.5rem;font-weight:800;margin:12px 0;">${c}/${t}</div><div class="progress-bar"><div class="progress-fill" style="width:${(c/t)*100}%"></div></div></div>`; 
        document.body.appendChild(o); 
        if(c === t) setTimeout(() => o.remove(), 800); 
    }
    function hideProgress() { const o = document.querySelector(".progress-overlay"); if(o) o.remove(); }
    
    function saveQueue() { localStorage.setItem(QUEUE_KEY, JSON.stringify(pendingQueue)); updateQueueUI(); }
    function loadQueue() { const s = localStorage.getItem(QUEUE_KEY); if(s) { pendingQueue = JSON.parse(s); updateQueueUI(); } }
    function updateQueueUI() { const b = document.getElementById("queueBar"); if(b) { b.style.display = pendingQueue.length > 0 ? "flex" : "none"; const qc = document.getElementById("queueCount"); if(qc) qc.innerText = `${pendingQueue.length}`; } }
    
    function addToQueue(r, rm) { 
        if(pendingQueue.some(i => i.sheetRow === r.sheetRow)) { showToast("⚠️ Already in queue!", "error"); return false; } 
        pendingQueue.push({ sheetRow: r.sheetRow, newRemarks: rm, sansad: r.sansad, jobCard: r.jobCard, applicantName: r.applicantName }); 
        saveQueue(); 
        showToast(`💾 Saved to queue (${pendingQueue.length} pending)`, "warning"); 
        return true; 
    }
    
    function getActiveRecords() { return allRecords.filter(r => !r.currentRemark || r.currentRemark.trim() === ""); }
    function getCompletedRecords() { return allRecords.filter(r => r.currentRemark && r.currentRemark.trim() !== ""); }
    function getUniqueSansadCount() { const s = new Set(); getActiveRecords().forEach(r => { if(r.sansad && r.sansad !== "—") s.add(r.sansad); }); return s.size; }
    function getUniqueJobCardCount(sansad) { const s = new Set(); getActiveRecords().forEach(r => { if(r.sansad === sansad && r.jobCard && r.jobCard !== "—") s.add(r.jobCard); }); return s.size; }
    function getUniqueApplicantCount(sansad, jobCard) { const s = new Set(); getActiveRecords().forEach(r => { if(r.sansad === sansad && r.jobCard === jobCard && r.applicantName && r.applicantName !== "—") s.add(r.applicantName); }); return s.size; }
    function getUniqueSansadValues() { const s = new Set(); getActiveRecords().forEach(r => { if(r.sansad && r.sansad !== "—") s.add(r.sansad); }); return Array.from(s).sort(); }
    function getUniqueJobCardValues(sansad) { const s = new Set(); getActiveRecords().forEach(r => { if(r.sansad === sansad && r.jobCard && r.jobCard !== "—") s.add(r.jobCard); }); return Array.from(s).sort(); }
    function getUniqueApplicantValues(sansad, jobCard) { const s = new Set(); getActiveRecords().forEach(r => { if(r.sansad === sansad && r.jobCard === jobCard && r.applicantName && r.applicantName !== "—") s.add(r.applicantName); }); return Array.from(s).sort(); }
    function findActiveRecord() { if(!selectedSansad || !selectedJobCard || !selectedApplicant) return null; return getActiveRecords().find(r => r.sansad === selectedSansad && r.jobCard === selectedJobCard && r.applicantName === selectedApplicant); }
    
    function getVerificationCounts() {
        const completed = getCompletedRecords();
        const counts = new Map();
        completed.forEach(r => { if(r.sansad && r.sansad !== "—") counts.set(r.sansad, (counts.get(r.sansad) || 0) + 1); });
        return counts;
    }
    
    function toRomanLabel(sansad) {
        if (!sansad) return "?";
        const upper = sansad.toUpperCase();
        let slashMatch = upper.match(/\/([IVXLCDM]+)$/);
        if (slashMatch) return slashMatch[1];
        let numMatch = upper.match(/(\d+)$/);
        if (numMatch) { const num = parseInt(numMatch[0]); const romanNumerals = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX"]; return romanNumerals[num] || num.toString(); }
        let romanMatch = upper.match(/\b([IVXLCDM]+)\b/);
        if (romanMatch && romanMatch[1].length <= 4) return romanMatch[1];
        return sansad.substring(0, 3);
    }
    
    function getColorForSansad(index) { const colors = BAR_GRADIENTS[index % BAR_GRADIENTS.length]; return `linear-gradient(180deg, ${colors.top}, ${colors.bottom})`; }
    
    function updateBarChart() {
        const counts = getVerificationCounts();
        const sansads = Array.from(counts.keys()).sort((a, b) => {
            const getNum = (s) => { const match = s.match(/\d+$/); if (match) return parseInt(match[0]); const romanMatch = s.match(/\/([IVXLCDM]+)$/i); if (romanMatch) { const roman = romanMatch[1].toUpperCase(); const romanMap = { I:1, II:2, III:3, IV:4, V:5, VI:6, VII:7, VIII:8, IX:9, X:10 }; return romanMap[roman] || 999; } return 999; };
            return getNum(a) - getNum(b);
        });
        const maxCount = Math.max(...Array.from(counts.values()), 1);
        const chartContainer = document.getElementById("barChartContainer");
        if(!chartContainer) return;
        if(sansads.length === 0) { chartContainer.innerHTML = `<div class="chart-title">✓ KYC Completed</div><div class="chart-legend">No completed records yet</div>`; return; }
        let barsHtml = `<div class="chart-title">✓ KYC Completed</div><div class="chart-bars">`;
        sansads.forEach((sansad, idx) => {
            const count = counts.get(sansad) || 0;
            const height = Math.max(8, Math.min(45, (count / maxCount) * 45));
            const romanLabel = toRomanLabel(sansad);
            const gradient = getColorForSansad(idx);
            barsHtml += `<div class="chart-bar-item"><div class="bar-value-top">${count}</div><div class="bar" style="height: ${height}px; background: ${gradient};"></div><div class="bar-label">${romanLabel}</div></div>`;
        });
        barsHtml += `</div><div class="chart-legend">Verification count</div>`;
        chartContainer.innerHTML = barsHtml;
    }
    
    function updateFilterDisplays() {
        const sansadCount = getUniqueSansadCount();
        const sansadSpan = document.getElementById("sansadCount");
        if(sansadSpan) { sansadSpan.innerText = sansadCount; if(sansadCount === 0) sansadSpan.classList.add("zero"); else sansadSpan.classList.remove("zero"); }
        if(selectedSansad) {
            const jobCount = getUniqueJobCardCount(selectedSansad);
            const jobSpan = document.getElementById("jobCardCount");
            if(jobSpan) { jobSpan.innerText = jobCount; if(jobCount === 0) jobSpan.classList.add("zero"); else jobSpan.classList.remove("zero"); }
        }
        if(selectedSansad && selectedJobCard) {
            const appCount = getUniqueApplicantCount(selectedSansad, selectedJobCard);
            const appSpan = document.getElementById("applicantCount");
            if(appSpan) { appSpan.innerText = appCount; if(appCount === 0) appSpan.classList.add("zero"); else appSpan.classList.remove("zero"); }
        }
    }
    
    function populateSansadDropdown() { 
        const vals = getUniqueSansadValues(); 
        const sel = document.getElementById("filterSansad"); 
        if(!sel) return; 
        sel.innerHTML = '<option value="">-- Select Sansad --</option>'; 
        vals.forEach(v => { sel.innerHTML += `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`; }); 
        updateFilterDisplays(); 
    }
    
    function updateJobCardDropdown() { 
        if(!selectedSansad) { const jobSel = document.getElementById("filterJobCard"); if(jobSel) { jobSel.innerHTML = '<option value="">-- Select Job Card --</option>'; jobSel.disabled = true; } updateFilterDisplays(); return; } 
        const vals = getUniqueJobCardValues(selectedSansad); 
        const jobSel = document.getElementById("filterJobCard"); 
        if(jobSel) { jobSel.innerHTML = '<option value="">-- Select Job Card --</option>'; vals.forEach(v => { jobSel.innerHTML += `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`; }); jobSel.disabled = vals.length === 0; } 
        selectedJobCard = ""; selectedApplicant = ""; 
        const appSel = document.getElementById("filterApplicant"); if(appSel) { appSel.innerHTML = '<option value="">-- Select Applicant --</option>'; appSel.disabled = true; } 
        filteredRecord = null; updateFilterDisplays(); renderCurrentView(); 
    }
    
    function updateApplicantDropdown() { 
        if(!selectedSansad || !selectedJobCard) { const appSel = document.getElementById("filterApplicant"); if(appSel) { appSel.innerHTML = '<option value="">-- Select Applicant --</option>'; appSel.disabled = true; } updateFilterDisplays(); return; } 
        const vals = getUniqueApplicantValues(selectedSansad, selectedJobCard); 
        const appSel = document.getElementById("filterApplicant");

    async function directUpdateWithConfirmation(rec, rm) { 
        if(!rm || rm.trim() === "") { 
            showToast("⚠️ Remark is mandatory! Please select an option before updating.", "error");
            // highlight dropdown
            const sel = document.getElementById("remarkSelect");
            if(sel) { sel.classList.add("error-border"); setTimeout(() => sel.classList.remove("error-border"), 1000); }
            return false; 
        }
        // Show confirmation modal first
        showConfirmationModal(rm, rec.applicantName, async () => {
            showProgress(1,1,"Updating KYC record..."); 
            try { 
                const p = new URLSearchParams(); 
                p.append("action", "updateRemarks"); 
                p.append("sheetRow", rec.sheetRow); 
                p.append("newRemarks", rm); 
                p.append("userName", currentUser.userName); 
                const res = await fetch(WEB_APP_URL, { method: "POST", body: p }); 
                const result = await res.json(); 
                if(result.success) { 
                    rec.currentRemark = rm; 
                    hideProgress(); 
                    showToast("✅ KYC Updated Successfully!", "success"); 
                    filteredRecord = null; 
                    resetFilters(); 
                    await getMyUpdates(currentUser.userName); 
                    await getAllUsersPerformance(); 
                    await getMyTodayKycCount(currentUser.userName);
                    await getTodayKycCount();
                    updateFilterDisplays(); 
                    updateBarChart(); 
                    renderCurrentView();
                    return true; 
                } else { hideProgress(); showToast(`❌ Failed: ${result?.error || "Unknown error"}`, "error"); return false; } 
            } catch(e) { hideProgress(); showToast(`❌ Network error: ${e.message}`, "error"); return false; } 
        }, () => { showToast("Update cancelled", "warning"); });
        return false;
    }

    async function syncData(isAuto = false) { if(isAutoSyncing) return; isAutoSyncing = true; const syncBtn = document.getElementById("syncBtn"); const progressContainer = document.getElementById("syncProgressContainer"); const progressFill = document.getElementById("syncProgressFill"); const progressText = document.getElementById("syncProgressText"); if(!isAuto && syncBtn) syncBtn.disabled = true; if(progressContainer) progressContainer.style.display = "block"; if(progressFill) progressFill.style.width = "0%"; if(progressText) progressText.innerText = "Connecting..."; const container = document.getElementById("cardContainer"); if(container) container.innerHTML = `<div class="waiting-card"><div class="loading-spinner"></div><div>Syncing data...</div></div>`; try { if(progressFill) progressFill.style.width = "30%"; if(progressText) progressText.innerText = "Fetching data..."; const res = await fetch(WEB_APP_URL + "?action=getData"); if(!res.ok) throw new Error(`HTTP ${res.status}`); const raw = await res.json(); if(progressFill) progressFill.style.width = "70%"; if(progressText) progressText.innerText = "Processing..."; allRecords = raw.map((row, i) => ({ sheetRow: i+2, sansad: row[COL_SANSAD] || "—", jobCard: row[COL_JOB_CARD] || "—", applicantName: row[COL_APPLICANT_NAME] || "—", guardian: row[COL_GUARDIAN] || "—", reason: row[COL_REASON] || "—", currentRemark: row[COL_NEW_REMARKS] || "" })); if(progressFill) progressFill.style.width = "100%"; if(progressText) progressText.innerText = "Complete!"; setTimeout(() => { if(progressContainer) progressContainer.style.display = "none"; }, 1000); const ac = getActiveRecords().length; const uniqueSansadCount = getUniqueSansadCount(); if(document.getElementById("recordCount")) document.getElementById("recordCount").innerHTML = `${ac} rows / ${uniqueSansadCount} Sansads`; if(document.getElementById("lastSyncTime")) document.getElementById("lastSyncTime").innerText = `Synced: ${new Date().toLocaleString()}`; updateFilterDispla         window.getTodayKycCount = getTodayKycCount;
        loadQueue(); 
        if(allRecords.length) { populateSansadDropdown(); resetFilters(); const ac = getActiveRecords().length; const uniqueSansadCount = getUniqueSansadCount(); if(document.getElementById("recordCount")) document.getElementById("recordCount").innerHTML = `${ac} rows / ${uniqueSansadCount} Sansads`; updateBarChart(); renderCurrentView(); }
        document.getElementById("syncBtn").onclick = () => syncData(false);
        document.getElementById("uploadOneBtn").onclick = uploadSingleFromQueue;
        document.getElementById("uploadAllBtn").onclick = uploadAllFromQueue;
        document.getElementById("resetFilterBtn").onclick = resetFilters;
        document.getElementById("filterSansad").addEventListener("change", (e) => { selectedSansad = e.target.value; updateJobCardDropdown(); renderCurrentView(); updateFilterDisplays(); });
        document.getElementById("filterJobCard").addEventListener("change", (e) => { selectedJobCard = e.target.value; updateApplicantDropdown(); renderCurrentView(); updateFilterDisplays(); });
        document.getElementById("filterApplicant").addEventListener("change", (e) => { selectedApplicant = e.target.value; renderCurrentView(); });
        document.getElementById("modeFilterBtn").onclick = () => { currentMode = "filter"; toggleModeUI(); };
        document.getElementById("modeSearchBtn").onclick = () => { currentMode = "search"; toggleModeUI(); };
        const si = document.getElementById("globalSearchInput"); if(si) si.addEventListener("input", () => { searchQuery = si.value; performSearchAndRender(); });
        document.getElementById("logoutBtn").onclick = () => { localStorage.removeItem(SESSION_KEY); currentUser = null; renderAuthPage(); };
        setTimeout(() => syncData(true), 500);
        getMyUpdates(currentUser.userName); getAllUsersPerformance(); getMyTodayKycCount(currentUser.userName); getTodayKycCount();
        fetch(`${WEB_APP_URL}?action=getOnlineCount`).then(res => res.json()).then(data => { if(data.success) document.getElementById("onlineCountValue").innerText = data.count; }).catch(() => {});
    }
    
    function init() { const savedUser = localStorage.getItem(SESSION_KEY); if(savedUser) { try { currentUser = JSON.parse(savedUser); window.currentUser = currentUser; renderMainApp(); checkIn(currentUser.userName); } catch(e) { renderAuthPage(); } } else { renderAuthPage(); } }
    init();
</script>
</body>
</html>
